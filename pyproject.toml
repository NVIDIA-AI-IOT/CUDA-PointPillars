[tool.poetry]
name = "pointpillar"
version = "0.1.0"
description = "PointPillar 3D object detection implementation"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
license = "Apache-2.0"
packages = [{include = "tool"}]

[tool.poetry.dependencies]
python = "^3.8"
torch = ">=1.9.0"
numpy = ">=1.19.0"
onnx = ">=1.9.0"
# onnxsim = ">=0.4.0"  # Commented out - requires cmake to build
fire = ">=0.4.0"
pyyaml = ">=5.4.0"
# pcdet = ">=0.5.0"  # Uncomment and adjust version when pcdet is available via PyPI

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
pytest-mock = "^3.11.0"

[tool.poetry.scripts]
test = "pytest:main"
tests = "pytest:main"
test-cov = "pytest:main"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
]

[tool.coverage.run]
branch = true
source = ["tests"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
    "*/virtualenv/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
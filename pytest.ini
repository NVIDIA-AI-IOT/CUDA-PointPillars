[pytest]
# Configuration for running tests without coverage
minversion = 7.0
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts = 
    -ra
    --strict-markers
    --strict-config
markers =
    unit: Unit tests
    integration: Integration tests  
    slow: Slow running tests